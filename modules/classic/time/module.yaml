api_version: 1
enabled: true
description: go-module-template's server-time query for WoW 1.12.1 (build 5875)
compose:
  file: compose.yaml
  service: module
grpc:
  descriptor_set: module.pb
rpc:
  status: /agentwow.classic.time.v1.Time/Status
  query_time: /agentwow.classic.time.v1.Time/QueryTime
packets:
  SMSG_QUERY_TIME_RESPONSE: /agentwow.classic.time.v1.Time/OnPacket
lifecycle:
  before_logout: /agentwow.classic.time.v1.Time/BeforeLogout
